<!DOCTYPE html>
<html>

<head>
  <title>ArcPay Mini</title>

  <style>

    body{
      background:#0f172a;
      color:white;
      font-family:sans-serif;
      margin:0;
      padding:30px;
    }

    .card{
      background:#1e293b;
      border-radius:20px;
      padding:25px;
      margin-top:20px;
      box-shadow:0 0 20px rgba(0,0,0,0.3);
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      background:#3b82f6;
      color:white;
      font-size:18px;
      margin-top:20px;
    }

    input{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      margin-top:15px;
      font-size:16px;
      box-sizing:border-box;
    }

    .balance{
      font-size:40px;
      font-weight:bold;
      margin-top:10px;
    }

    .label{
      opacity:0.7;
      font-size:14px;
    }

    .address{
      margin-top:15px;
      word-break:break-all;
      font-size:13px;
      opacity:0.8;
    }

  </style>

</head>

<body>

<h1>ArcPay Mini</h1>

<div class="card">

  <div class="label">
    Wallet Balance
  </div>

  <div
  class="balance"
  id="balance">
    0.00
  </div>

  <div
  class="address"
  id="address">
    Wallet not connected
  </div>

</div>

<button id="connectBtn">
Connect Wallet
</button>

<input
type="text"
id="receiver"
placeholder="Receiver Address"
/>

<input
type="number"
id="amount"
placeholder="Amount"
/>

<button id="sendBtn">
Send
</button>

<script src="app.js"></script>

</body>

</html>
