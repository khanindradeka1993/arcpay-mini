<!DOCTYPE html>
<html>

<head>

  <title>ArcPay Mini</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <style>

    body{
      margin:0;
      padding:25px;
      font-family:sans-serif;

      background:
      linear-gradient(
        180deg,
        #0f172a,
        #020617
      );

      color:white;
    }

    .logo{
      font-size:34px;
      font-weight:bold;
      margin-top:20px;
    }

    .tag{
      opacity:0.7;
      margin-top:5px;
    }

    .card{

      margin-top:30px;

      padding:25px;

      border-radius:24px;

      background:
      rgba(255,255,255,0.05);

      border:
      1px solid rgba(255,255,255,0.08);

      backdrop-filter:blur(10px);

    }

    .label{
      opacity:0.7;
      font-size:14px;
    }

    .balance{
      font-size:42px;
      font-weight:bold;
      margin-top:10px;
    }

    .address{
      margin-top:15px;
      word-break:break-all;
      font-size:13px;
      opacity:0.7;
    }

    input{

      width:100%;

      padding:16px;

      margin-top:16px;

      border:none;

      border-radius:16px;

      box-sizing:border-box;

      background:#1e293b;

      color:white;

      font-size:16px;

    }

    button{

      width:100%;

      padding:16px;

      margin-top:18px;

      border:none;

      border-radius:16px;

      background:
      linear-gradient(
        90deg,
        #3b82f6,
        #06b6d4
      );

      color:white;

      font-size:18px;

      font-weight:bold;

    }

    .footer{
      margin-top:30px;
      text-align:center;
      opacity:0.5;
      font-size:12px;
    }

  </style>

</head>

<body>

<div class="logo">
  ArcPay Mini
</div>

<div class="tag">
  Powered by Arc Testnet
</div>

<div class="card">

  <div class="label">
    USDC Balance
  </div>

  <div
    class="balance"
    id="balance"
  >
    0.00
  </div>

  <div
    class="address"
    id="address"
  >
    Wallet not connected
  </div>

</div>

<button id="connectBtn">
  Connect Wallet
</button>

<input
  type="text"
  id="receiver"
  placeholder="Receiver Address"
/>

<input
  type="number"
  id="amount"
  placeholder="Amount"
/>

<button id="sendBtn">
  Send USDC
</button>

<div class="footer">
  Built on Arc Network
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<script src="app.js"></script>

</body>

</html>
