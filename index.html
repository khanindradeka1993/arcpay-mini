<!DOCTYPE html>
<html>

<head>

  <title>ArcPay Mini</title>

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0"/>

  <style>

    body {

      background: #020b24;
      color: white;
      font-family: Arial;
      padding: 20px;

    }

    .card {

      background: #101c3a;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;

    }

    button {

      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      margin-top: 15px;

    }

    input {

      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      margin-top: 15px;
      font-size: 16px;

    }

    .title {

      font-size: 28px;
      font-weight: bold;

    }

    .balance {

      font-size: 40px;
      margin-top: 10px;

    }

    .address {

      font-size: 12px;
      color: #aaa;
      margin-top: 10px;
      word-break: break-all;

    }

  </style>

</head>

<body>

  <h1>ArcPay Mini</h1>

  <div class="card">

    <div>Wallet Balance</div>

    <div
    id="balance"
    class="balance">

      0.00

    </div>

    <div
    id="address"
    class="address">

      Wallet not connected

    </div>

  </div>

  <button id="connectBtn">

    Connect Wallet

  </button>

  <input
  id="receiver"
  placeholder="@username"/>

  <input
  id="amount"
  placeholder="Amount"/>

  <button id="sendBtn">

    Send USDC

  </button>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

  <script src="app.js"></script>

</body>

</html>
