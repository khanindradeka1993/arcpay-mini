<!DOCTYPE html>
<html>
<head>
  <title>ArcPay Lite</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    body {
    background: linear-gradient(
        180deg,
        #020817 0%,
        #07152d 100%
    );
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
    margin: 0;
    min-height: 100vh;
}

    .card {
  background: #121A2E;
  border: 1px solid #1e293b;
      border-radius: 24px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
backdrop-filter: blur(12px);
    }

    .title {
    font-size: 34px;
    font-weight: 800;
    margin-bottom: 20px;
    color: white;
}

    .label {
      color: #94a3b8;
      font-size: 14px;
    }

    .balance {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -2px;
    margin-top: 10px;
    margin-bottom: 10px;
}

    .address {
      color: #64748b;
      font-size: 13px;
      word-break: break-all;
    }

    button {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 14px;
  background: linear-gradient(135deg,#4F7CFF,#7B5CFF);
  color: white;
  font-size: 16px;
  font-weight: 600;
  margin-top: 12px;
}
button:hover {
  opacity: 0.9;
}
    
    .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 15px;
    margin-bottom: 20px;
}

.actions button {
    height: 70px;
    margin-top: 0;
    background: #121A2E;
    border: 1px solid #334155;
    border-radius: 18px;
    font-size: 15px;
    font-weight: 600;
}

    .activity {
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="title">
    ⚡ ArcPay Lite
  </div>

  <div class="card">
    <div class="label">
      Wallet Balance
    </div>

    <div
      id="balance"
      class="balance">
      0.00 USDC
    </div>
<button id="refreshBtn">
  Refresh Balance
</button>
    <div
      id="address"
      class="address">
      Wallet not connected
    </div>
  </div>

  <button id="connectBtn">
    Connect Wallet
  </button>

  <div class="actions">
    <button id="sendBtn">
    📤 Send
    </button>

    <button id="scanBtn">
        📷 Scan QR
    </button>

    <button id="receiveBtn">
    📥 Receive
    </button>
<button id="requestBtn">
    💸 Request
</button>
  </div>
<p id="recipientText" style="text-align:center; color:#94a3b8; margin-top:10px;">
No recipient selected
</p>
  
<div class="card">
  <h3>Profile</h3>

  <p>Status: <span id="statusText">Not Connected</span></p>

<p>Wallet: <span id="walletText">Not Connected</span></p>

<button id="copyBtn">Copy Address</button>
<button id="faucetBtn">Get Testnet USDC</button>
</div>
<div id="qrContainer" style="display:none; text-align:center; margin-top:15px;">
  <div id="qrcode"></div>
  <p id="qrAddress" style="margin-top:10px; font-size:12px; word-break:break-all;"></p>
</div>
<div id="scannerContainer" style="display:none; margin-top:15px;">
    <div id="reader" style="width:100%;"></div>
</div>  
<div id="requestContainer" style="display:none; text-align:center; margin-top:15px;">
  <h3 id="requestText"></h3>
  <div id="requestQr"></div>
</div>
  <div class="card">
  <h3>Recent Activity</h3>

    <div
      id="activity"
      class="activity">
      No transactions yet
    </div>
  </div>

  <div class="footer">
  <p>Built on Arc Testnet</p>
  <p>Powered by USDC</p>
  <p>Version 0.1</p>
  </div>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
